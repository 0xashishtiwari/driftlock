<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 366" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="dl-lock-clip">
      <path d="M102 40 87 50 75 62 69 70 63 81v2l-5 11-1 8-1 1v5l-1 1v38l-1 1H30v150l11 4h3l3 2v14h194v-14l3-2 14-4V149l-1-1h-23l-1-1v-36l-1-1v-6l-1-1-1-8-5-14-9-15-14-15-16-11h-2l-7-4-9-3-9-1-1-1-21-1-1 1h-7l-5 2h-4l-9 3-7 4Zm-3 53 4-6 8-8 9-6 10-4 9-1 1-1h8l1 1 9 1 10 4 9 6 10 11 6 12 1 7 1 1v37l-1 1H93l-1-1v-32l1-1 1-9Z"/>
    </clipPath>
    <clipPath id="dl-trail-clip">
      <path d="M-4000-4000h9000v9000h-9000Z"/>
      <path d="M102 40 87 50 75 62 69 70 63 81v2l-5 11-1 8-1 1v5l-1 1v38l-1 1H30v150l11 4h3l3 2v14h194v-14l3-2 14-4V149l-1-1h-23l-1-1v-36l-1-1v-6l-1-1-1-8-5-14-9-15-14-15-16-11h-2l-7-4-9-3-9-1-1-1-21-1-1 1h-7l-5 2h-4l-9 3-7 4Zm-3 53 4-6 8-8 9-6 10-4 9-1 1-1h8l1 1 9 1 10 4 9 6 10 11 6 12 1 7 1 1v37l-1 1H93l-1-1v-32l1-1 1-9Z"/>
    </clipPath>
    <style>
      .dl-lock { fill: #c2410c; }
      .dl-in { fill: #fff7ed; }
      .dl-plane {
        transform-box: fill-box;
        transform-origin: center;
        animation: dl-plane-flight 2.4s ease-in-out infinite;
      }
      .dl-out {
        fill: none;
        stroke: #fff7ed;
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-dasharray: 1100;
        stroke-dashoffset: 1100;
        animation: dl-draw 3.2s ease-in-out infinite;
      }
      .dl-trail {
        fill: none;
        stroke: #fff7ed;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 1 12;
        animation: dl-flow 1.4s linear infinite;
      }
      @keyframes dl-draw {
        0%, 12% { stroke-dashoffset: 1100; opacity: 0; }
        45%, 75% { stroke-dashoffset: 0; opacity: .8; }
        100% { stroke-dashoffset: -1100; opacity: 0; }
      }
      @keyframes dl-flow {
        from { stroke-dashoffset: 0; opacity: 0; }
        20% { opacity: .8; }
        to { stroke-dashoffset: -52; opacity: 0; }
      }
      @keyframes dl-plane-flight {
        0%, 100% { transform: translate(-8px, 2px) rotate(4deg) scale(.96); }
        50% { transform: translate(22px, -12px) rotate(-8deg) scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .dl-plane, .dl-out, .dl-trail { animation: none; }
        .dl-out { stroke-dashoffset: 0; opacity: .65; }
        .dl-trail { opacity: .25; }
      }
    </style>
  </defs>
  <path class="dl-lock" fill-rule="evenodd" d="M102 40 87 50 75 62 69 70 63 81v2l-5 11-1 8-1 1v5l-1 1v38l-1 1H30v150l11 4h3l3 2v14h194v-14l3-2 14-4V149l-1-1h-23l-1-1v-36l-1-1v-6l-1-1-1-8-5-14-9-15-14-15-16-11h-2l-7-4-9-3-9-1-1-1-21-1-1 1h-7l-5 2h-4l-9 3-7 4Zm-3 53 4-6 8-8 9-6 10-4 9-1 1-1h8l1 1 9 1 10 4 9 6 10 11 6 12 1 7 1 1v37l-1 1H93l-1-1v-32l1-1 1-9Z"/>
