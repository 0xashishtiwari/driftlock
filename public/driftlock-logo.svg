    </g>
    <g clip-path="url(#dl-trail-clip)">
      <path class="dl-trail" d="M145 248 20 390"/>
      <path class="dl-out" fill-rule="evenodd" d="M32 297v2l15 4 91-46 1 1v60h10v-60l2-1 12 6 2 2 76 38 14-4-1-3-96-63v-33l-1-1v-5l-4-12-2-3-5-4-6 1-5 6-3 7v4l-2 6v9l-1 1v24l-21 15-3 1-29 20-3 1-32 22Zm120 30v18l25 7v-7Zm-11 0-26 18v7l25-7 1-1Z"/>
    </g>
  </g>
</svg>
